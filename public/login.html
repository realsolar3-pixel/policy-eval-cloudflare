<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리자 로그인</title><link rel="stylesheet" href="/style.css"><header><h1>투자상품정책협의회 · 관리자</h1></header><main style="max-width:460px"><section class="card"><h2>관리자 로그인</h2><form id="f"><label>이름<input id="name" required autocomplete="username"></label><label>인증코드<input id="code" type="password" required autocomplete="current-password"></label><button>로그인</button></form><p id="notice"></p></section></main><script src="/common.js"></script><script>$('f').onsubmit=async e=>{e.preventDefault();try{await send('/login',{name:$('name').value,code:$('code').value,role:'admin'});location.href='/admin.html'}catch(e){notice(e.message,true)}}</script></html>
