<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>투자상품 평가위원</title><link rel="stylesheet" href="/style.css"><header><h1>투자상품정책협의회 · 평가위원</h1></header><main><p id="notice"></p><div id="submitSuccess" class="card" hidden style="text-align:center;border:2px solid #86b6ff;background:#eaf3ff;padding:24px 16px;margin-bottom:20px"><strong style="display:block;color:#1454b8;font-size:clamp(1.25rem,5vw,1.65rem);line-height:1.5">평가가 서버에 정상 제출되었습니다!</strong><p style="color:#24456f">수고하셨습니다. 다시 접속하면 평가 내용을 수정할 수 있습니다.</p></div><section id="auth" class="card" hidden><h2>평가위원 로그인</h2><form id="f"><label>이름<input id="name" required></label><label>회차 공통 비밀번호<input id="code" type="password" required></label><p class="muted" id="roundHint"></p><button>로그인</button></form></section><section id="app" hidden><div class="card"><div class="row"><b id="who"></b><button class="secondary" id="logout">로그아웃</button></div><p class="muted">모든 상품의 3단계·4단계 평가를 완료한 뒤 제출하세요. 제출 후 다시 접속하여 수정할 수 있습니다.</p></div><div id="sheets"></div><button id="submit">평가 제출 / 수정 저장</button></section></main><script src="/common.js"></script><script>
let form,answers={},who;const round=new URLSearchParams(location.search).get('round')||'';$('roundHint').textContent=round?'평가 회차: '+round+' · 관리자에게 안내받은 공통 비밀번호를 입력하세요.':'회차가 지정된 평가위원 링크로 접속해 주세요.';
$('f').onsubmit=async e=>{e.preventDefault();try{if(!round)throw Error('회차가 지정된 평가 링크로 접속해 주세요');await send('/login',{name:$('name').value,code:$('code').value,role:'evaluator',round});await load()}catch(e){notice(e.message,true)}};
$('logout').onclick=async()=>{await send('/logout',{});location.reload()};
async function load(){try{const me=await api('/me');if(me.role!=='evaluator'||me.auth_round!==round){$('auth').hidden=false;$('app').hidden=true;return}who=me.name;form=await api('/form?round='+encodeURIComponent(round));if(!form.products.length){notice('이번 회차에는 본인이 평가할 안건이 없습니다. 제안 안건 등 평가 제외 대상은 표시되지 않습니다.');$('auth').hidden=true;$('app').hidden=false;$('who').textContent=who+' · '+form.round;$('sheets').replaceChildren();$('submit').hidden=true;return}const saved=await api('/my-response?round='+encodeURIComponent(form.round));const draftKey='policy-eval-draft:'+who+':'+form.round;let draft={};try{draft=JSON.parse(localStorage.getItem(draftKey)||'{}')}catch(e){}answers=saved.response?.results||draft||{};$('auth').hidden=true;$('app').hidden=false;$('who').textContent=who+' · '+form.round;render();if(saved.savedAt)notice('이전 제출내용을 불러왔습니다. 수정 후 다시 제출할 수 있습니다.')}catch(e){notice(e.message,true)}}

let openProductId=null;
function getAnswer(p){return answers[p.id]||(answers[p.id]={s3:{scores:[],vote:null},s4:{scores:[],vote:null}})}
function stageState(p,k){const cfg=p.stages[k],st=getAnswer(p)[k]||(getAnswer(p)[k]={scores:[],vote:null}),filled=cfg.skipQual||cfg.items.every((_,i)=>Number.isInteger(st.scores[i])&&st.scores[i]>=0&&st.scores[i]<=cfg.items[i].max),total=Number(cfg.quant||0)+(st.scores||[]).reduce((sum,n)=>sum+(Number.isInteger(n)?n:0),0),needVote=cfg.skipQual||(filled&&total<form.threshold);return{st,filled,total,needVote,complete:filled&&(!needVote||['찬성','반대'].includes(st.vote))}}
function saveDraft(){try{localStorage.setItem('policy-eval-draft:'+who+':'+form.round,JSON.stringify(answers))}catch(e){}}
function render(){const box=$('sheets');box.replaceChildren();if(!openProductId){const heading=document.createElement('h2');heading.textContent='평가 대상 상품 '+form.products.length+'건';box.append(heading);let complete=0;for(const p of form.products){const ok=['s3','s4'].every(k=>stageState(p,k).complete);if(ok)complete++;const btn=document.createElement('button');btn.className='eval-product-item';btn.innerHTML='<span class="eval-product-title"></span><span class="eval-product-status"></span>';btn.querySelector('.eval-product-title').textContent=p.name;btn.querySelector('.eval-product-status').textContent=ok?'입력 완료':'작성 필요';btn.onclick=()=>{openProductId=p.id;render()};box.append(btn)}const info=document.createElement('p');info.className='muted';info.textContent=complete+' / '+form.products.length+'개 상품 입력 완료';box.append(info);$('submit').hidden=false;$('submit').disabled=false;return}
$('submit').hidden=true;const p=form.products.find(p=>p.id===openProductId);if(!p){openProductId=null;render();return}const back=document.createElement('button');back.className='secondary';back.textContent='← 상품 목록';back.onclick=()=>{openProductId=null;render()};box.append(back);const title=document.createElement('h2');title.textContent=p.name;title.style.cssText='text-align:center;font-size:clamp(1.4rem,5vw,2rem);font-weight:800;color:#123d86;background:#eaf2ff;border:2px solid #b9d1fa;border-radius:14px;padding:18px 12px;margin:18px 0 24px;line-height:1.4;';box.append(title);
for(const k of ['s3','s4']){const cfg=p.stages[k],sec=document.createElement('section');sec.className='card eval-stage eval-stage-mobile';const h=document.createElement('h3');h.textContent=(k==='s3'?'3단계':'4단계')+' 평가';sec.append(h);const quant=document.createElement('div');quant.className='eval-quant';quant.innerHTML='<span>정량 점수 (사전 입력)</span><strong></strong>';quant.querySelector('strong').textContent=(cfg.quant??0)+' / '+(cfg.quantMax??'–')+'점';sec.append(quant);if(!cfg.skipQual)cfg.items.forEach((it,i)=>{const item=document.createElement('div');item.className='eval-question';const title=document.createElement('div');title.className='eval-question-label';title.textContent=(i+1)+'. '+it.label;const line=document.createElement('label');line.className='eval-question-answer';const hint=document.createElement('span');hint.textContent='평가점수 (0~'+it.max+'점)';const inp=document.createElement('input');inp.type='number';inp.min=0;inp.max=it.max;inp.step=1;inp.inputMode='numeric';inp.placeholder='점수 입력';inp.className='eval-score-mobile';inp.setAttribute('aria-label',it.label+' 점수');const state=stageState(p,k);inp.value=Number.isInteger(state.st.scores[i])?state.st.scores[i]:'';inp.oninput=()=>{const raw=inp.value.trim();let n=raw===''?null:Math.trunc(Number(raw));if(n!==null&&Number.isFinite(n)){n=Math.max(0,Math.min(it.max,n));inp.value=n}else n=null;state.st.scores[i]=n;inp.classList.toggle('eval-score-missing',n===null);saveDraft();refresh()};inp.classList.toggle('eval-score-missing',!Number.isInteger(state.st.scores[i]));line.append(hint,inp);item.append(title,line);sec.append(item)});const total=document.createElement('div');total.className='eval-mobile-total';sec.append(total);const voteBox=document.createElement('div');voteBox.className='eval-mobile-vote';const voteInfo=document.createElement('p');voteInfo.className='muted';voteBox.append(voteInfo);const voteButtons=document.createElement('div');voteButtons.className='eval-vote-buttons';for(const v of ['찬성','반대']){const btn=document.createElement('button');btn.type='button';btn.className='secondary';btn.textContent=v;btn.onclick=()=>{const st=stageState(p,k).st;st.vote=st.vote===v?null:v;saveDraft();refresh()};voteButtons.append(btn)}voteBox.append(voteButtons);sec.append(voteBox);box.append(sec);function refresh(){const state=stageState(p,k);total.textContent='총점 '+state.total+'점'+' / '+(Number(cfg.quantMax||0)+cfg.items.reduce((a,b)=>a+b.max,0))+'점';voteBox.hidden=!state.needVote;voteInfo.textContent=cfg.skipQual?'정성평가 생략: 찬반표결 필수':'총점 '+state.total+'점 · '+form.threshold+'점 미만이므로 찬반표결 필수';[...voteButtons.children].forEach(btn=>btn.classList.toggle('selected-vote',btn.textContent===state.st.vote))}refresh()}
const done=document.createElement('button');done.textContent='저장하고 상품 목록으로';done.onclick=()=>{const p=form.products.find(x=>x.id===openProductId);if(!p)return;const complete=['s3','s4'].every(k=>stageState(p,k).complete);if(!complete){jumpToMissing(p);return}getAnswer(p).complete=true;saveDraft();notice(p.name+' 평가내용이 임시 저장되었습니다. 모든 상품 평가 후 최종 제출해 주세요.');openProductId=null;render()};box.append(done)}
function jumpToMissing(p){openProductId=p.id;render();for(const k of ['s3','s4']){const st=stageState(p,k),cfg=p.stages[k];if(st.complete)continue;const stage=$('sheets').querySelectorAll('.eval-stage-mobile')[k==='s3'?0:1];let target;if(!st.filled){const i=cfg.items.findIndex((it,i)=>!Number.isInteger(st.st.scores[i])||st.st.scores[i]<0||st.st.scores[i]>it.max);target=stage.querySelectorAll('.eval-score-mobile')[i];}else if(st.needVote&&!st.st.vote){target=stage.querySelector('.eval-mobile-vote');}target=target||stage;target.classList.add('eval-missing-target');target.scrollIntoView({behavior:'smooth',block:'center'});if(target.matches('input'))setTimeout(()=>target.focus({preventScroll:true}),400);notice(p.name+' · '+(k==='s3'?'3단계':'4단계')+'의 미입력 항목을 확인해 주세요.',true);return}}
$('submit').onclick=async()=>{try{const incomplete=form.products.find(p=>!['s3','s4'].every(k=>stageState(p,k).complete));if(incomplete){jumpToMissing(incomplete);return}const results={};for(const p of form.products){const a=getAnswer(p);a.complete=['s3','s4'].every(k=>stageState(p,k).complete);if(!a.complete)throw Error(p.name+'의 평가가 완료되지 않았습니다.');results[p.id]=a}await send('/submit',{type:'policy-eval-result',evaluator:who,round:form.round,results});localStorage.removeItem('policy-eval-draft:'+who+':'+form.round);$('submitSuccess').hidden=false;$('notice').textContent='';$('notice').className='';$('app').hidden=true;scrollTo({top:0,behavior:'smooth'})}catch(e){notice(e.message,true);scrollTo({top:0,behavior:'smooth'})}};
load();
</script></html>
