<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>투자상품 평가위원</title><link rel="stylesheet" href="/fonts.css"><link rel="stylesheet" href="/style.css"><header class="ev-head"><div class="ev-head-in"><span class="ev-mark" aria-hidden="true">IBK</span><div><span class="ev-eyebrow">투자상품정책협의회</span><h1>평가위원 평가표</h1></div></div></header><main class="ev-main"><p id="notice"></p><div id="submitSuccess" class="card ev-success" hidden><span class="ev-success-icon" aria-hidden="true">✓</span><strong>평가가 서버에 정상 제출되었습니다!</strong><p>수고하셨습니다. 다시 접속하면 평가 내용을 수정할 수 있습니다.</p></div><section id="auth" class="card" hidden><h2>평가위원 로그인</h2><form id="f"><label>이름<input id="name" required></label><label>회차 공통 비밀번호<input id="code" type="password" required></label><p class="muted" id="roundHint"></p><button>로그인</button></form></section><template id="flowTpl"><div class="ev-flow">
<div class="flow-title"><strong>투자상품 사전평가 절차</strong><span>1~4단계</span></div>
<div class="flow-roles"><span class="role-dept">🏢 상품소관부서</span><span class="role-me">👤 정책협의회 위원</span></div>
<ol class="flow-steps">
<li class="flow-step is-pre"><span class="flow-no">1</span><div><b>사전점검 ① 운용사·증권사·보험사</b><p>재무건전성·업력을 Y/N으로 확인</p><div class="flow-tags"><span class="tag-dept">🏢 소관부서 체크</span><span class="tag-pass">통과: 모두 Y</span></div></div></li>
<li class="flow-step is-pre"><span class="flow-no">2</span><div><b>사전점검 ② 기초자산</b><p>주식·채권·파생·부동산·실물·ETF형 기준을 Y/N으로 확인</p><div class="flow-tags"><span class="tag-dept">🏢 소관부서 체크</span><span class="tag-pass">통과: 모두 Y</span></div></div></li>
<li class="flow-step is-mine"><span class="flow-no">3</span><div><b>집합투자업자(운용사) 평가</b><p>정성: 서비스 · 금전 관련 소송 · 신뢰성</p><div class="flow-calc"><span class="fc-quant">🔒 정량<small>소관부서</small></span><span class="fc-op">+</span><span class="fc-qual">✏️ 정성<small>위원 입력</small></span><span class="fc-op">=</span><span class="fc-sum">총점</span></div><div class="flow-tags"><span class="tag-pass">통과: 정량 49점↑ 그리고 총점 70점↑</span></div></div></li>
<li class="flow-step is-mine"><span class="flow-no">4</span><div><b>상품별 평가</b><p>정성: 지역·섹터 상황, 소비자보호 등 (평가표마다 다름)</p><div class="flow-calc"><span class="fc-quant">🔒 정량<small>소관부서</small></span><span class="fc-op">+</span><span class="fc-qual">✏️ 정성<small>위원 입력</small></span><span class="fc-op">=</span><span class="fc-sum">총점</span></div><div class="flow-tags"><span class="tag-pass">통과: 평가표별 기준점</span></div><table class="flow-cut"><tr><th>평가표</th><th>정량</th><th>총점</th></tr><tr><td>대부분(A·B·D·E, 채권, ETF 등)</td><td>49↑</td><td>70↑</td></tr><tr><td>(C) 신규 설정 펀드</td><td>35↑</td><td>70↑</td></tr><tr><td>파생결합증권·사채 편입</td><td>56↑</td><td>80↑</td></tr></table></div></li>
</ol>
<div class="flow-rule"><div class="fr-head">각 단계 기준을</div><div class="fr-split"><div class="fr-pass"><b>충족하면</b><span>✅ 다음 단계로</span></div><div class="fr-vote"><b>못 미치면</b><span>⚖️ 위원 찬반 투표<br>찬성 2/3 이상 → 통과</span></div></div>
<div class="fr-final">🏛️ 1~4단계 모두 통과 → <b>비예금상품위원회(협의회) 상정</b></div>
<p class="fr-note">정성 점수는 위원별 점수의 평균으로 산출해요.<br>근거: 투자상품 정책협의회 운영기준 [별표1·2] (2026.8.20. 개정)</p></div>
</div></template><section id="app" hidden><div class="card ev-userbar"><div class="row"><b id="who"></b><button class="secondary" id="logout">로그아웃</button></div><p class="muted">모든 상품의 3단계·4단계 평가를 완료한 뒤 제출하세요. 제출 후 다시 접속하여 수정할 수 있습니다.</p></div><div id="sheets"></div><button id="submit">평가 제출 / 수정 저장</button></section></main><script src="/common.js"></script><script>
let form,answers={},who;const round=new URLSearchParams(location.search).get('round')||'';$('roundHint').textContent=round?'평가 회차: '+round+' · 관리자에게 안내받은 공통 비밀번호를 입력하세요.':'회차가 지정된 평가위원 링크로 접속해 주세요.';
$('f').onsubmit=async e=>{e.preventDefault();try{if(!round)throw Error('회차가 지정된 평가 링크로 접속해 주세요');await send('/login',{name:$('name').value,code:$('code').value,role:'evaluator',round});await load()}catch(e){notice(e.message,true)}};
$('logout').onclick=async()=>{await send('/logout',{});location.reload()};
async function load(){try{const me=await api('/me');if(me.role!=='evaluator'||me.auth_round!==round){$('auth').hidden=false;$('app').hidden=true;return}who=me.name;form=await api('/form?round='+encodeURIComponent(round));if(!form.products.length){notice('이번 회차에는 본인이 평가할 안건이 없습니다. 제안 안건 등 평가 제외 대상은 표시되지 않습니다.');$('auth').hidden=true;$('app').hidden=false;$('who').textContent=who+' · '+form.round;$('sheets').replaceChildren();$('submit').hidden=true;return}const saved=await api('/my-response?round='+encodeURIComponent(form.round));const draftKey='policy-eval-draft:'+who+':'+form.round;let draft={};try{draft=JSON.parse(localStorage.getItem(draftKey)||'{}')}catch(e){}answers=saved.response?.results||draft||{};$('auth').hidden=true;$('app').hidden=false;$('who').textContent=who+' · '+form.round;render();if(saved.savedAt)notice('이전 제출내용을 불러왔습니다. 수정 후 다시 제출할 수 있습니다.')}catch(e){notice(e.message,true)}}

const minOf=it=>Math.max(1,Math.round(Number(it.max||0)/5));/* 등급 배점: 최고점의 20%가 최저점 (10→2, 20→4, 5→1) */
function splitLabel(t){t=String(t||'').trim();const m=t.match(/^(.+?)\s+[—–-]{1,2}\s+(.+)$/s)||t.match(/^(.+?)\s*[—–]\s*(.+)$/s);if(!m)return{title:t,points:[]};return{title:m[1].trim(),points:m[2].split(/\n+|\s*;\s*/).map(x=>x.replace(/^[•·*\-]\s*/,'').trim()).filter(Boolean)}}
function flowNode(){return $('flowTpl').content.firstElementChild.cloneNode(true)}
let flowSeen=false;
let openProductId=null;
function getAnswer(p){return answers[p.id]||(answers[p.id]={s3:{scores:[],vote:null},s4:{scores:[],vote:null}})}
function stageState(p,k){const cfg=p.stages[k],st=getAnswer(p)[k]||(getAnswer(p)[k]={scores:[],vote:null}),filled=cfg.skipQual||cfg.items.every((it,i)=>Number.isInteger(st.scores[i])&&st.scores[i]>=minOf(it)&&st.scores[i]<=it.max),total=Number(cfg.quant||0)+(st.scores||[]).reduce((sum,n)=>sum+(Number.isInteger(n)?n:0),0),needVote=cfg.skipQual||(filled&&total<form.threshold);return{st,filled,total,needVote,complete:filled&&(!needVote||['찬성','반대'].includes(st.vote))}}
function saveDraft(){try{localStorage.setItem('policy-eval-draft:'+who+':'+form.round,JSON.stringify(answers))}catch(e){}}
function render(){const box=$('sheets');box.replaceChildren();if(!openProductId){const fd=document.createElement('details');fd.className='ev-flow-toggle';fd.open=!flowSeen;flowSeen=true;const fs=document.createElement('summary');fs.textContent='📋 평가 절차 보기';fd.append(fs,flowNode());const fok=document.createElement('button');fok.type='button';fok.className='flow-ok';fok.textContent='확인했어요, 평가 시작하기';fok.onclick=()=>{fd.open=false;fd.scrollIntoView({behavior:'smooth',block:'start'})};fd.append(fok);box.append(fd);const heading=document.createElement('h2');heading.className='ev-list-title';heading.textContent='평가 대상 상품 '+form.products.length+'건';box.append(heading);let complete=0;for(const p of form.products){const ok=['s3','s4'].every(k=>stageState(p,k).complete);if(ok)complete++;const btn=document.createElement('button');btn.className='eval-product-item';btn.innerHTML='<span class="eval-product-title"></span><span class="eval-product-status"></span>';btn.querySelector('.eval-product-title').textContent=p.name;btn.querySelector('.eval-product-status').textContent=ok?'입력 완료':'작성 필요';btn.classList.toggle('is-done',ok);btn.onclick=()=>{openProductId=p.id;render()};box.append(btn)}const info=document.createElement('p');info.className='muted';info.textContent=complete+' / '+form.products.length+'개 상품 입력 완료';box.append(info);$('submit').hidden=false;$('submit').disabled=false;return}
$('submit').hidden=true;const p=form.products.find(p=>p.id===openProductId);if(!p){openProductId=null;render();return}const back=document.createElement('button');back.className='secondary';back.textContent='← 상품 목록';back.onclick=()=>{openProductId=null;render()};box.append(back);const title=document.createElement('h2');title.textContent=p.name;title.className='eval-product-heading';box.append(title);
for(const k of ['s3','s4']){const cfg=p.stages[k],sec=document.createElement('section');sec.className='card eval-stage eval-stage-mobile';
const qualMax=cfg.skipQual?0:cfg.items.reduce((a,b)=>a+b.max,0),allMax=Number(cfg.quantMax||0)+qualMax;
const h=document.createElement('h3');h.textContent=(k==='s3'?'3단계':'4단계')+' 평가';sec.append(h);
/* ① 정량 점수: 관리자 사전 입력(수정 불가) */
const qbox=document.createElement('div');qbox.className='eval-quant-box';
const qtop=document.createElement('div');qtop.className='eval-quant-top';
const qlab=document.createElement('span');qlab.className='eval-quant-label';qlab.textContent='① 정량 점수';
const qlock=document.createElement('span');qlock.className='eval-lock-badge';qlock.textContent='🔒 사전 입력 · 수정 불가';
qtop.append(qlab,qlock);
const qnum=document.createElement('div');qnum.className='eval-quant-num';
const qv=document.createElement('strong');qv.textContent=String(cfg.quant??0);
const qm=document.createElement('span');qm.textContent=' / '+(cfg.quantMax??'–')+'점';qnum.append(qv,qm);
const qn=document.createElement('p');qn.className='eval-quant-note';qn.textContent='세부 내역은 배부된 평가자료(엑셀)를 참고해 주세요.';
qbox.append(qtop,qnum,qn);sec.append(qbox);
/* ② 정성 평가: 요약 + 문항 */
const chips=[];
if(!cfg.skipQual){
 const qh=document.createElement('div');qh.className='eval-qual-head';
 const qt=document.createElement('div');qt.className='eval-qual-title';
 const qs=document.createElement('strong');qs.textContent='② 정성 평가';
 const qb=document.createElement('span');qb.className='eval-qual-badge';qb.textContent='✏️ 위원 입력';
 qt.append(qs,qb);
 const qp=document.createElement('p');qp.textContent='오늘 평가할 항목 '+cfg.items.length+'개 · 정성 합계 '+qualMax+'점';
 qh.append(qt,qp);sec.append(qh);
 const sum=document.createElement('ol');sum.className='eval-item-summary';
 cfg.items.forEach((it,i)=>{const li=document.createElement('li');const btn=document.createElement('button');btn.type='button';btn.className='eval-item-chip';
  const no=document.createElement('span');no.className='chip-no';no.textContent=String(i+1);
  const nm=document.createElement('span');nm.className='chip-name';nm.textContent=splitLabel(it.label).title;
  const st=document.createElement('span');st.className='chip-state';
  btn.append(no,nm,st);btn.onclick=()=>{const q=sec.querySelectorAll('.eval-question')[i];if(q){q.scrollIntoView({behavior:'smooth',block:'center'});const inp=q.querySelector('input');if(inp)setTimeout(()=>inp.focus({preventScroll:true}),350)}};
  li.append(btn);sum.append(li);chips.push(btn)});
 sec.append(sum);
}
if(!cfg.skipQual)cfg.items.forEach((it,i)=>{const item=document.createElement('div');item.className='eval-question';
 const parts=splitLabel(it.label);
 const title=document.createElement('div');title.className='eval-question-label';
 const tn=document.createElement('span');tn.className='q-no';tn.textContent=String(i+1);
 const tt=document.createElement('span');tt.className='q-title';tt.textContent=parts.title;
 const tmx=document.createElement('span');tmx.className='q-max';tmx.textContent=it.max+'점';
 title.append(tn,tt,tmx);item.append(title);
 if(parts.points.length){const ul=document.createElement('ul');ul.className='eval-question-points';for(const pt of parts.points){const li=document.createElement('li');li.textContent=pt;ul.append(li)}item.append(ul)}
 const line=document.createElement('label');line.className='eval-question-answer';const hint=document.createElement('span');const mn=minOf(it);hint.textContent='평가점수 ('+mn+'~'+it.max+'점)';
 const inp=document.createElement('input');inp.type='number';inp.min=mn;inp.max=it.max;inp.step=1;inp.inputMode='numeric';inp.placeholder='점수 입력';inp.className='eval-score-mobile';inp.setAttribute('aria-label',it.label+' 점수');
 const state=stageState(p,k);inp.value=Number.isInteger(state.st.scores[i])?state.st.scores[i]:'';inp.title='최소 '+mn+'점 · 최대 '+it.max+'점';
 inp.oninput=()=>{const raw=inp.value.trim();let n=raw===''?null:Math.trunc(Number(raw));let low=false;if(n!==null&&Number.isFinite(n)){if(n>it.max){n=it.max;inp.value=n}if(n<mn){low=true;n=null}}else n=null;state.st.scores[i]=n;inp.classList.toggle('eval-score-missing',n===null);hint.textContent=low?'⚠️ 최소 '+mn+'점부터 입력할 수 있어요 ('+mn+'~'+it.max+'점)':'평가점수 ('+mn+'~'+it.max+'점)';hint.classList.toggle('is-warn',low);saveDraft();refresh()};
 inp.classList.toggle('eval-score-missing',!(Number.isInteger(state.st.scores[i])&&state.st.scores[i]>=mn));line.append(hint,inp);item.append(line);sec.append(item)});
/* ③ 총점 게이지: 정량 + 정성, 기준점 표시 */
const total=document.createElement('div');total.className='eval-mobile-total eval-gauge';
const gHead=document.createElement('div');gHead.className='gauge-head';
const gLab=document.createElement('span');gLab.textContent=cfg.skipQual?'③ 총점 (정량만)':'③ 총점 = 정량 + 정성';
const gVal=document.createElement('strong');gHead.append(gLab,gVal);
const bar=document.createElement('div');bar.className='gauge-bar';
const segQ=document.createElement('i');segQ.className='seg-quant';const segL=document.createElement('i');segL.className='seg-qual';
const mark=document.createElement('b');mark.className='gauge-mark';const markT=document.createElement('em');markT.textContent='기준 '+form.threshold+'점';mark.append(markT);
bar.append(segQ,segL,mark);
const legend=document.createElement('div');legend.className='gauge-legend';
const lgQ=document.createElement('span');lgQ.className='lg-quant';lgQ.textContent='정량';
const lgL=document.createElement('span');lgL.className='lg-qual';lgL.textContent='정성';
const lgR=document.createElement('span');lgR.className='lg-rule';lgR.textContent=form.threshold+'점 미만이면 찬반투표';
legend.append(lgQ);if(!cfg.skipQual)legend.append(lgL);legend.append(lgR);
total.append(gHead,bar,legend);sec.append(total);
const pct=v=>allMax?Math.max(0,Math.min(100,v/allMax*100)):0;mark.style.left=pct(form.threshold)+'%';if(cfg.skipQual)mark.hidden=true;
/* ④ 찬반 */
const voteBox=document.createElement('div');voteBox.className='eval-mobile-vote';const voteInfo=document.createElement('p');voteInfo.className='muted';voteBox.append(voteInfo);const voteButtons=document.createElement('div');voteButtons.className='eval-vote-buttons';for(const v of ['찬성','반대']){const btn=document.createElement('button');btn.type='button';btn.className='secondary';btn.textContent=(v==='찬성'?'👍 ':'👎 ')+v;btn.dataset.vote=v;btn.onclick=()=>{const st=stageState(p,k).st;st.vote=st.vote===v?null:v;saveDraft();refresh()};voteButtons.append(btn)}voteBox.append(voteButtons);sec.append(voteBox);box.append(sec);
function refresh(){const state=stageState(p,k),quant=Number(cfg.quant||0),qual=state.total-quant;
 gVal.textContent=state.total+'점 / '+allMax+'점';segQ.style.width=pct(quant)+'%';segL.style.left=pct(quant)+'%';segL.style.width=pct(qual)+'%';
 total.classList.toggle('is-below',state.filled&&state.total<form.threshold);total.classList.toggle('is-pass',state.filled&&state.total>=form.threshold&&!cfg.skipQual);
 lgR.textContent=cfg.skipQual?'정성 평가 생략 → 찬반투표':!state.filled?form.threshold+'점 미만이면 찬반투표':(state.total<form.threshold?'기준 미달 → 찬반투표 대상':'기준 충족 → 찬반투표 없음');
 chips.forEach((c,i)=>{const ok=Number.isInteger(state.st.scores[i]);c.classList.toggle('is-done',ok);c.querySelector('.chip-state').textContent=ok?state.st.scores[i]+'점':'미입력'});
 voteBox.hidden=!state.needVote;voteInfo.textContent=cfg.skipQual?'⚖️ 정량점수 미달로 찬반표결 대상입니다':'⚖️ 총점 '+state.total+'점 · '+form.threshold+'점 미만이므로 찬반표결이 필요해요';
 [...voteButtons.children].forEach(btn=>btn.classList.toggle('selected-vote',btn.dataset.vote===state.st.vote))}
refresh()}
const done=document.createElement('button');done.textContent='저장하고 상품 목록으로';done.onclick=()=>{const p=form.products.find(x=>x.id===openProductId);if(!p)return;const complete=['s3','s4'].every(k=>stageState(p,k).complete);if(!complete){jumpToMissing(p);return}getAnswer(p).complete=true;saveDraft();notice(p.name+' 평가내용이 임시 저장되었습니다. 모든 상품 평가 후 최종 제출해 주세요.');openProductId=null;render()};box.append(done)}
function jumpToMissing(p){openProductId=p.id;render();for(const k of ['s3','s4']){const st=stageState(p,k),cfg=p.stages[k];if(st.complete)continue;const stage=$('sheets').querySelectorAll('.eval-stage-mobile')[k==='s3'?0:1];let target;if(!st.filled){const i=cfg.items.findIndex((it,i)=>!Number.isInteger(st.st.scores[i])||st.st.scores[i]<minOf(it)||st.st.scores[i]>it.max);target=stage.querySelectorAll('.eval-score-mobile')[i];}else if(st.needVote&&!st.st.vote){target=stage.querySelector('.eval-mobile-vote');}target=target||stage;target.classList.add('eval-missing-target');target.scrollIntoView({behavior:'smooth',block:'center'});if(target.matches('input'))setTimeout(()=>target.focus({preventScroll:true}),400);notice(p.name+' · '+(k==='s3'?'3단계':'4단계')+'의 미입력 항목을 확인해 주세요.',true);return}}
$('submit').onclick=async()=>{try{const incomplete=form.products.find(p=>!['s3','s4'].every(k=>stageState(p,k).complete));if(incomplete){jumpToMissing(incomplete);return}const results={};for(const p of form.products){const a=getAnswer(p);a.complete=['s3','s4'].every(k=>stageState(p,k).complete);if(!a.complete)throw Error(p.name+'의 평가가 완료되지 않았습니다.');results[p.id]=a}await send('/submit',{type:'policy-eval-result',evaluator:who,round:form.round,results});localStorage.removeItem('policy-eval-draft:'+who+':'+form.round);$('submitSuccess').hidden=false;$('notice').textContent='';$('notice').className='';$('app').hidden=true;scrollTo({top:0,behavior:'smooth'})}catch(e){notice(e.message,true);scrollTo({top:0,behavior:'smooth'})}};
load();
</script></html>
